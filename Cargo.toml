[package]
name = "ytproxy"
version = "1.1.3"
edition = "2021"
description = "Fast, low-memory web proxy in Rust (YouTube-ready)"
license = "MIT"

[[bin]]
name = "ytproxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = ["full"] }
hyper = { version = "1.9", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.5"
http-body-util = "0.1"
bytes = "1.12"
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "http2",
    "cookies",
    "socks",
    "stream",
    "json",
    "hickory-dns",
] }
lol_html = "1.2"
url = "2.5"
percent-encoding = "2.3"
regex = "1.13"
env_logger = "0.11"
log = "0.4"
futures-util = "0.3"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.2"
serde_json = "1.0"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
